name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check src/ bin/

      - name: Run ruff format check
        run: uv run ruff format --check src/ bin/

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ads_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ads_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        ports:
          - 9092:9092
        command: >-
          redpanda start
          --mode dev-container
          --kafka-addr 0.0.0.0:9092
          --advertise-kafka-addr localhost:9092

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DATABASE_NAME: ads_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5434
      POSTGRES_USERNAME: postgres
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
      KAFKA_BROKERS: localhost:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v
